name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs viejos del mismo PR/branch (no quema minutos en empujes seguidos)
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# Menos privilegio posible: QA solo necesita leer el repo
permissions:
  contents: read

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm --workspace apps/web run build

      - name: Build admin app
        run: npm --workspace apps/admin run build

      - name: Build Firebase functions
        run: npm --workspace apps/functions run build

      # DEPLOY-READY-01: el build productivo de Hosting rechaza entornos locales
      # (variables o .env de la app) y artefactos con valores de desarrollo.
      - name: Verify production Hosting build guards
        run: node tools/test-build-hosting.mjs

      - name: Verify pilot CORS configuration guard
        run: node --test tools/test-configure-pilot-cors.mjs

      # Build productivo real con un proyecto ficticio (no existe ni se despliega):
      # comprueba que out/ no conserva emuladores ni proyectos de desarrollo.
      # La API key ficticia se genera al vuelo (aleatoria, con el formato que exige
      # el validador) para no versionar un literal con forma de credencial.
      - name: Production Hosting build with placeholder project
        env:
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: tbb-pilot-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: tbb-pilot-placeholder
          NEXT_PUBLIC_FUNCTIONS_BASE_URL: https://us-central1-tbb-pilot-placeholder.cloudfunctions.net
          NEXT_PUBLIC_STORE_SLUGS: tbb
        run: |
          NEXT_PUBLIC_FIREBASE_API_KEY="$(node tools/test-build-hosting.mjs --print-placeholder-key)"
          export NEXT_PUBLIC_FIREBASE_API_KEY
          npm run build:hosting:web
          npm run build:hosting:admin

  api-contracts:
    name: api-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: demo-amon-ci
      FUNCTIONS_BASE_URL: http://127.0.0.1:5001/demo-amon-ci/us-central1/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts and Functions
        run: |
          npm --workspace packages/shared run build
          npm --workspace apps/functions run build

      - name: Verify standalone pilot Functions package
        run: |
          node tools/test-prepare-firebase-pilot.mjs
          node tools/prepare-firebase-pilot.mjs
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix .firebase-pilot/functions --workspaces=false
          node -e 'const p="./.firebase-pilot/functions/"; const z=require(p+"node_modules/zod/package.json").version; if (!z.startsWith("4.")) throw Error(`Expected Zod 4, got ${z}`); require(p+"lib/index.js")'

      - name: Verify bootstrap create-only behavior in Firestore Emulator
        run: npx --yes firebase-tools@15.34.1 emulators:exec --config firebase.pilot.json --project demo-amon-ci --only firestore 'node --import tsx --test tools/test-bootstrap-preview-emulator.mjs'

      - name: Run API contracts against local emulators
        run: npx --yes firebase-tools@15.34.1 emulators:exec --project "$FIREBASE_PROJECT_ID" --only auth,firestore,functions 'npm run test:e2e:api'

      - name: Run API contracts against pilot package
        run: npx --yes firebase-tools@15.34.1 emulators:exec --config firebase.pilot.json --project "$FIREBASE_PROJECT_ID" --only auth,firestore,functions 'npm run test:e2e:api'
