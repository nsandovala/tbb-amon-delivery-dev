name: HOSTING-SPIKE-01

# Verifica que web y admin funcionan como sitios estáticos en el emulador
# oficial de Firebase Hosting, contra Auth, Firestore y Functions emulados.
# Proyecto demo (`demo-amon-ci`): no toca ningún recurso real ni despliega nada.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-hosting:
    name: static-hosting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: demo-amon-ci
      PLAYWRIGHT_HTML_OPEN: never
      # Build estático apuntando a los emuladores (sin proxy de next dev).
      NEXT_OUTPUT: export
      NEXT_PUBLIC_USE_EMULATOR: "true"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-amon-ci
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
      NEXT_PUBLIC_FUNCTIONS_BASE_URL: http://127.0.0.1:5001/demo-amon-ci/us-central1
      NEXT_PUBLIC_STORE_SLUGS: tbb
      # Seed del tenant tbb en el emulador de Firestore.
      SEED_TARGET: emulator
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts and Functions
        run: |
          npm --workspace packages/shared run build
          npm --workspace apps/functions run build

      - name: Static export of web and admin
        run: |
          npm --workspace apps/web run build
          npm --workspace apps/admin run build
          test -f apps/web/out/index.html
          test -f apps/web/out/tienda/tbb.html
          for page in login pedidos pos operacion; do test -f "apps/admin/out/$page.html"; done

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Serve static sites on Hosting emulator and verify
        run: >-
          npx --yes firebase-tools@15.34.1 emulators:exec
          --config firebase.hosting.json
          --project "$FIREBASE_PROJECT_ID"
          --only auth,firestore,functions,hosting
          'npm run seed && npm run test:e2e:hosting'

      - name: Upload report and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-spike-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
