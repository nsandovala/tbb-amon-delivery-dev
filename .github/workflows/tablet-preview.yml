name: TBB-TABLET-PREVIEW-01

# Verifica la vista previa estática para tablet: build con la carta demo, sin
# Firebase ni Functions en el bundle, servida por el emulador oficial de Hosting
# con la config y las cabeceras reales. Proyecto demo (`demo-amon-ci`): no toca
# ningún recurso real ni despliega nada.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tablet-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tablet-preview:
    name: tablet-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify preview guards
        run: node tools/test-preview.mjs

      - name: Build web preview and verify out/
        run: npm run build:preview:web

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Serve preview on Hosting emulator and verify on tablet profiles
        run: >-
          npx --yes firebase-tools@15.34.1 emulators:exec
          --config firebase.preview-web.json
          --project demo-amon-ci
          --only hosting
          'npm run test:e2e:preview'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablet-preview-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
